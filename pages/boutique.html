<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation — Boutique du Club</title>
  <link rel="icon" type="image/png" href="/static/petitlogo.png">
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: Arial, sans-serif; /* Matched from layout standards */
    }

    main {
      flex: 1;
      padding: 60px 20px;
      background-color: #f5f5f5; /* Matched light grey page background */
    }

    .wrapper {
      max-width: 1200px; /* Made 50% larger (from 800px) to give the store breathing room */
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e; /* Brand Navy */
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    /* --- Expanded Form Container Box --- */
    .shop-container {
      background: white;
      border: 1px solid #e5e7eb; /* Matches the subtle gray layout borders */
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      position: relative;
      height: 900px; /* Tall enough to cleanly hold products and checkout actions */
    }

    .shop-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      main { padding: 40px 15px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
<div id="header"></div>
<script>
  fetch('/pages/header.html')
    .then(r => r.text())
    .then(html => {
      const headerEl = document.getElementById('header');
      headerEl.innerHTML = html;

      // innerHTML doesn't run <script> tags automatically — re-create
      // them so they actually execute.
      headerEl.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    });
</script>

  <!-- Main Content -->
  <main>
    <div class="wrapper">
      
      <h1>Boutique du Club</h1>
      <p class="subtitle">Commandez vos articles officiels directement en ligne</p>
      
      <!-- The expanded storefront container -->
      <div class="shop-container">
        <iframe 
          title='Formulaire d’achat sécurisé propulsé par Zeffy' 
          src='https://www.zeffy.com/embed/ticketing/b2788b3b-7978-4109-8f7c-4103e3ef6c0c' 
          allowpaymentrequest 
          allowTransparency="true">
        </iframe>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div id="footer"></div>
  <script>
    fetch('/pages/footer.html')
      .then(r => r.text())
      .then(html => document.getElementById('footer').innerHTML = html);
  </script>

</body>
</html>
