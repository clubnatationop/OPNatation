<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation — Commanditaires</title>
  <link rel="icon" type="image/png" href="/static/petitlogo.png">
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: Arial, sans-serif; /* Matched from Temps.html */
    }

    main {
      flex: 1;
      padding: 60px 20px;
      background-color: #f5f5f5; /* Matched from Temps.html */
    }

    .wrapper {
      max-width: 1200px; /* Widened from 900px to give the larger sponsor logos room */
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* --- Sponsor rows --- */
    .sponsor-list {
      display: flex;
      flex-direction: column;
      gap: 56px;
      margin-bottom: 3rem;
    }

    .sponsor-row {
      display: flex;
      align-items: center;
      gap: 112px;
      background: white;
      border: 1px solid #e5e7eb; /* Matched card border from Temps.html */
      border-radius: 12px; /* Matched card radius from Temps.html */
      padding: 5.5rem;
    }

    /* Alternates logo left/right — applied via nth-child, see JS-free rule below */
    .sponsor-row.reverse {
      flex-direction: row-reverse;
    }

    .sponsor-logo {
      flex: 0 0 480px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sponsor-logo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Placeholder logo box — remove this and use a real <img> once logos are available */
    .logo-placeholder {
      width: 100%;
      height: 100%;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc; /* Matched table header bg from Temps.html */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: center;
      padding: 8px;
    }

    .sponsor-text h3 {
      font-size: 1.15rem;
      color: #1a1a2e;
      margin: 0 0 0.5rem 0;
    }

    .sponsor-text p {
      color: #555;
      line-height: 1.7;
      font-size: 0.95rem;
      margin: 0;
    }

    @media (max-width: 700px) {
      .sponsor-row,
      .sponsor-row.reverse {
        flex-direction: column;
        text-align: center;
        gap: 16px;
        padding: 1.5rem;
      }

      .sponsor-logo {
        flex: 0 0 auto;
        width: 380px;
        height: 220px;
      }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; } /* Matched from Temps.html */
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script>
    fetch('/pages/header.html')
      .then(r => r.text())
      .then(html => {
        const headerEl = document.getElementById('header');
        headerEl.innerHTML = html;

        // innerHTML doesn't run <script> tags automatically — re-create
        // them so they actually execute.
        headerEl.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>
