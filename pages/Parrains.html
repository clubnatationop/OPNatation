  <title>OPNatation — Parrains</title>
  <link rel="icon" type="image/png" href="/static/petitlogo.png">
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: Arial, sans-serif; /* Matched from Temps.html */
    }

    main {
      flex: 1;
      padding: 60px 20px;
      background-color: #f5f5f5; /* Matched from Temps.html */
    }

    .wrapper {
      max-width: 1200px; /* Matched from Commanditaires.html to give the photos room */
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 3rem;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* --- Parrain cards --- */
    .parrain-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 3rem;
    }

    .parrain-card {
      background: white;
      border: 1px solid #e5e7eb; /* Matched card border from Temps.html */
      border-radius: 12px; /* Matched card radius from Temps.html */
      overflow: hidden; /* Lets the photo's top corners follow the card's radius */
      text-align: center;
    }

    .parrain-photo {
      width: 100%;
      aspect-ratio: 1 / 1; /* Square photo filling the full card width */
    }

    .parrain-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Placeholder photo — remove this and use a real <img> once photos are available */
    .photo-placeholder {
      width: 100%;
      height: 100%;
      border: 1px dashed #cbd5e1;
      background: #f8fafc; /* Matched table header bg from Temps.html */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.8rem;
      text-align: center;
      padding: 8px;
      box-sizing: border-box;
    }

    .parrain-info {
      padding: 0.75rem;
    }

    .parrain-info h3 {
      font-size: 0.9rem;
      color: #1a1a2e;
      margin: 0 0 0.4rem 0;
    }

    .parrain-swimmer {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: normal;
      color: #1a56db;
      background-color: #e8f0fe; /* Matched .badge style from Temps.html */
      padding: 3px 10px;
      border-radius: 99px;
    }

    @media (max-width: 700px) {
      .parrain-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .parrain-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; } /* Matched from Temps.html */
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="header"></div>
  <script>
    fetch('/pages/header.html')
      .then(r => r.text())
      .then(html => {
        const headerEl = document.getElementById('header');
        headerEl.innerHTML = html;

        // innerHTML doesn't run <script> tags automatically — re-create
        // them so they actually execute.
        headerEl.querySelectorAll('script').forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>

  <main>
