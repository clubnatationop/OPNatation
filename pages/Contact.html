<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPNatation — Contact</title>
  <link rel="icon" type="image/png" href="/static/petitlogo.png">
  <style>
    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 20px;
      background-color: #f8fafc;
    }

    .contact-wrapper {
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 2rem;
      color: #1a1a2e;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-align: center;
    }

    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.95rem;
      text-align: center;
    }

    .contact-form {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.1);
      background-color: white;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #1a56db;
      color: white;
      border: none;
      border-radius: 99px;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #1546b5;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .contact-info {
      margin-top: 30px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .info-card {
      flex: 1;
      min-width: 160px;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .info-card .icon {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .info-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .info-card p, .info-card a {
      font-size: 0.9rem;
      color: #1a1a2e;
      text-decoration: none;
      word-break: break-word;
    }

    .info-card a {
      transition: color 0.2s;
    }

    .info-card a:hover {
      color: #1a56db;
    }

    @media (max-width: 600px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }

      .contact-form {
        padding: 25px;
      }
      
      .contact-info {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Header Injection Point -->
  <div id="header"></div>
<script>
  fetch('/pages/header.html')
    .then(r => r.text())
    .then(html => {
      const headerEl = document.getElementById('header');
      headerEl.innerHTML = html;

      // innerHTML doesn't run <script> tags automatically — re-create
      // them so they actually execute.
      headerEl.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    });
</script>

  <main>
    <div class="contact-wrapper">
      <h1>Nous contacter</h1>
      <p class="subtitle">Une question? N'hésitez pas à nous écrire.</p>

      <div class="contact-form">
        <form action="https://formspree.io/f/xzepoeqb" method="POST">

          <div class="form-row">
            <div class="form-group">
              <label for="prenom">Prénom</label>
              <input type="text" id="prenom" name="prenom" placeholder="Jean" required>
            </div>
            <div class="form-group">
              <label for="nom">Nom</label>
              <input type="text" id="nom" name="nom" placeholder="Tremblay" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Courriel</label>
            <input type="email" id="email" name="email" placeholder="jean@exemple.com" required>
          </div>

          <div class="form-group">
            <label for="sujet">Sujet</label>
            <select id="sujet" name="sujet">
              <option value="">Choisir un sujet...</option>
              <option value="information">Demande d'information</option>
              <option value="plainte">Plainte</option>
              <option value="commandite">Commandite</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Votre message..." required></textarea>
          </div>

          <button type="submit" class="submit-btn">Envoyer le message</button>
        </form>
      </div>

      <div class="contact-info">
        <div class="info-card">
          <div class="icon">📧</div>
          <h3>Courriel</h3>
          <a href="mailto:administration@natationop.com">info@opnatation.ca</a>
        </div>
        <div class="info-card">
          <div class="icon">📍</div>
          <h3>Adresse</h3>
          <p>Sainte-Anne-des-Monts QC G4V 2L4</p>
        </div>
        <div class="info-card">
          <div class="icon">📱</div>
          <h3>Téléphone</h3>
          <a href="tel:+14189677706">+1 (418) 967-7706</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Dynamic Footer Injection Point -->
  <div id="footer"></div>

  <!-- Component Loader JavaScript (Cleaned and separated completely below the body to avoid render freezes) -->
  <script>
    // Fetch Header Component with active cache-busting timestamp string parameter
    fetch('/pages/header.html?v=' + Date.now())
      .then(response => response.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
      });

    // Fetch Footer Component
    fetch('/pages/footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;
      });
  </script>

</body>
</html>
