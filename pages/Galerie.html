<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie - OPNatation</title>
  <link rel="icon" type="image/png" href="/static/petitlogo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .gallery-container {
      max-width: 1200px;
      width: 100%;
      margin: 40px auto;
      padding: 0 40px;
      flex: 1;
    }

    .gallery-title {
      font-family: Arial, sans-serif;
      color: #1a1a2e;
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Modern Responsive CSS Grid for individual photos */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    /* Individual photo frames styling */
    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      background-color: #f3f4f6;
      height: 220px; /* Forces uniform grid card sizes */
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Keeps photo aspect ratios clean without squishing */
      transition: transform 0.3s ease;
      display: block;
      cursor: pointer;
    }

    /* Interactive hover effects */
    .gallery-item img:hover {
      transform: scale(1.06);
    }

    /* Loading placeholder state text styling */
    .loading-text {
      font-family: Arial, sans-serif;
      text-align: center;
      color: #888;
      grid-column: 1 / -1;
      padding: 40px 0;
      font-size: 1.1rem;
    }

    @media (max-width: 700px) {
      .gallery-container {
        padding: 0 20px;
        margin: 25px auto;
      }
      .gallery-title {
        font-size: 1.6rem;
        margin-bottom: 20px;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); /* 2 columns on mobile devices */
        gap: 12px;
      }
      .gallery-item {
        height: 140px;
      }
    }
  </style>
</head>
<body>

  <h1>En construction</h1>

<div id="header"></div>
<script>
  fetch('/pages/header.html')
    .then(r => r.text())
    .then(html => {
      const headerEl = document.getElementById('header');
      headerEl.innerHTML = html;

      // innerHTML doesn't run <script> tags automatically — re-create
      // them so they actually execute.
      headerEl.querySelectorAll('script').forEach(oldScript => {
        const newScript = document.createElement('script');
        if (oldScript.src) {
          newScript.src = oldScript.src;
        } else {
          newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
      });
    });
</script>


<!--
  <div class="gallery-container">
    <h1 class="gallery-title">Galerie</h1>
    
    <div class="gallery-grid" id="flickr-gallery">
      <div class="loading-text">Chargement des photos...</div>
    </div>
  </div>
-->
  <div id="footer"></div>

  <script>
    // Component Loader Engine for Header & Footer Components
    fetch('/pages/header.html?v=' + Date.now())
      .then(r => r.text())
      .then(h => document.getElementById('header').innerHTML = h);

    fetch('/pages/footer.html')
      .then(r => r.text())
      .then(h => document.getElementById('footer').innerHTML = h);

    // --- AUTOMATED FLICKR INDIVIDUAL PHOTO EXTRACTOR ---
    // Target your specific public album feed URL
    const flickrFeedUrl = "https://www.flickr.com/services/feeds/photoset.gne?set=72177720334054802&nsid=204677686@N06&lang=en-us&format=json&jsoncallback=renderPhotos";

    // Create a dynamic script tag element to safely bypass browser CORS restrictions
    const script = document.createElement('script');
    script.src = flickrFeedUrl;
    document.body.appendChild(script);

    // This callback function triggers automatically when Flickr responds with your data
    function renderPhotos(data) {
      const galleryGrid = document.getElementById('flickr-gallery');
      galleryGrid.innerHTML = ''; // Wipe out the loading placeholder text

      if (!data.items || data.items.length === 0) {
        galleryGrid.innerHTML = '<div class="loading-text">Aucune photo trouvée dans cet album.</div>';
        return;
      }

      // Loop through every individual item inside your live Flickr album
      data.items.forEach(item => {
        // Grab the medium size image item asset link path string definition
        const lowResImg = item.media.m;
        // Swap out the "_m" tag suffix for "_b" to retrieve gorgeous high-res versions for display grids
        const highResImg = lowResImg.replace('_m.', '_b.');

        // Build the HTML architecture element structure card dynamically
        const card = document.createElement('div');
        card.className = 'gallery-item';

        // Wrap the photo inside a link card so clicking it opens up the high-res view naturally
        card.innerHTML = `
          <a href="${highResImg}" target="_blank">
            <img src="${highResImg}" alt="${item.title || 'Photo OP'}" title="${item.title || 'Agrandir la photo'}">
          </a>
        `;
        
        galleryGrid.appendChild(card);
      });
    }
  </script>
</body>
</html>
